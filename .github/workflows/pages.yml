# Publishes web/ to GitHub Pages. Runs on pushes that touch the site, on demand,
# and from update.yml (pushes made by the workflow token do not trigger other workflows).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # pick up the data commit made earlier in the same run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
